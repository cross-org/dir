on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    deno_ci:
        uses: cross-org/workflows/.github/workflows/deno-ci.yml@main
        with:
            entrypoint: mod.ts

    # Keep jsr_dependencies in sync with the imports in deno.jsonc.
    bun_ci:
        uses: cross-org/workflows/.github/workflows/bun-ci.yml@main
        with:
            jsr_dependencies: "@cross/env @cross/runtime @cross/utils @cross/test @std/assert"

    node_ci:
        uses: cross-org/workflows/.github/workflows/node-ci.yml@main
        with:
            jsr_dependencies: "@cross/env @cross/runtime @cross/utils @cross/test @std/assert"
            test_target: "src/*.test.ts"

    # deno_ci only runs on Linux, this covers the Windows and macOS code paths.
    platform_tests:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Setup repo
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Run tests
              run: deno test -A
